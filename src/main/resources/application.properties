
spring.application.name=helpif-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpif}
spring.datasource.username=${DB_USERNAME:helpif}
spring.datasource.password=${DB_PASSWORD:helpif_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8080
