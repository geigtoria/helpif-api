
services:
  postgres:
    image: postgres:16
    container_name: helpif-postgres
    environment:
      POSTGRES_DB: helpif
      POSTGRES_USER: helpif
      POSTGRES_PASSWORD: helpif_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpif -d helpif"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
